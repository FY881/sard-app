def releaseAbiSplitsEnabled = providers
    .gradleProperty("releaseAbiSplits")
    .map { value -> value.toBoolean() }
    .getOrElse(false)

react {
    hermesFlags = ["-O", "-output-source-map"]
}

def sardKeystoreFile = new File(rootDir, "../plugins/android/sard.keystore")
def sardKeystoreProps = new Properties()
def sardPropsFile = new File(rootDir, "../plugins/android/sard-keystore.properties")
if (sardPropsFile.exists()) { sardPropsFile.withInputStream { sardKeystoreProps.load(it) } }

android {
    signingConfigs {
        sard {
            storeFile sardKeystoreFile
            storePassword sardKeystoreProps.getProperty("SARD_KEYSTORE_PASSWORD")
            keyAlias "sard"
            keyPassword sardKeystoreProps.getProperty("SARD_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        // Library resources (Material Components, RN, play-services) only for
        // languages the app itself ships (src/i18n/languages/*); other locales
        // fall back to English, matching the app's own JS fallback.
        resConfigs "af", "ar", "as", "ca", "cs", "da", "de", "el", "en", "es", "fi", "fr", "he", "hi", "hu", "id", "it", "ja", "ko", "nl", "no", "or", "pl", "pt", "ro", "ru", "sq", "sr", "sv", "tr", "uk", "vi", "zh"
    }

    splits {
        abi {
            enable releaseAbiSplitsEnabled
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk releaseAbiSplitsEnabled
        }
    }

    buildTypes {
        release {
            // Sard is a personal app: release is signed with the stable Sard key
            // so every new APK installs over the previous one.
            signingConfig signingConfigs.sard
            resValue "string", "app_name", "سَرد"
        }

        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix "debug"
            versionNameSuffix "-debug"
        }

        preRelease {
            initWith release
            matchingFallbacks = ["release"]
            applicationIdSuffix ".preRelease"
            versionNameSuffix "-pre-release"
            signingConfig signingConfigs.sard
            resValue "string", "app_name", "سَرد تجريبي"
        }
    }
}

def preReleaseVersionCode = providers.gradleProperty("preReleaseVersionCode")
def preReleaseVersionName = providers.gradleProperty("preReleaseVersionName")

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.each { output ->
            if (preReleaseVersionCode.isPresent()) {
                output.versionCode.set(
                    preReleaseVersionCode.map { value -> value.toInteger() },
                )
            }
            if (preReleaseVersionName.isPresent()) {
                output.versionName.set(preReleaseVersionName)
            }
        }
    }
    onVariants(selector().withBuildType("preRelease")) { variant ->
        variant.outputs.each { output ->
            if (preReleaseVersionCode.isPresent()) {
                output.versionCode.set(
                    preReleaseVersionCode.map { value -> value.toInteger() },
                )
            }
            if (preReleaseVersionName.isPresent()) {
                output.versionName.set(preReleaseVersionName)
            }
        }
    }
}
