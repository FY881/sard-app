appId: app.sard.reader
---
- runFlow: ../subflows/start.yaml
- tapOn:
    text: "(المزيد|More)"
    optional: true
- scrollUntilVisible:
    element:
      text: "الإعدادات"
    direction: DOWN
    timeout: 8000
    optional: true
- tapOn:
    text: "الإعدادات"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 24-settings
- runFlow: ../subflows/healthy.yaml
- tapOn:
    text: "(Repositories|المستودعات)"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 25-repositories
- runFlow: ../subflows/healthy.yaml
- tapOn:
    text: "إضافة"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 26-repository-add-dialog
- runFlow: ../subflows/healthy.yaml
