appId: app.sard.reader
name: Sard 1.1 «سَرد+» hub and the eight category screens
---
- runFlow: ../subflows/start.yaml
- tapOn:
    text: "(المزيد|More)"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "more-sard-plus"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: v11-11-plus-hub
- runFlow: ../subflows/healthy.yaml
- scroll
- takeScreenshot: v11-12-plus-hub-categories
- runFlow: ../subflows/healthy.yaml
# --- category reading: bring the card into view (it may be above or below), open it, come back to the hub
- scrollUntilVisible:
    element:
      id: "sard-plus-cat-reading"
    direction: UP
    timeout: 6000
    centerElement: true
    optional: true
- scrollUntilVisible:
    element:
      id: "sard-plus-cat-reading"
    direction: DOWN
    timeout: 8000
    centerElement: true
- tapOn:
    id: "sard-plus-cat-reading"
- waitForAnimationToEnd
- takeScreenshot: v11-13-reading-tools
- runFlow: ../subflows/healthy.yaml
- scroll
- takeScreenshot: v11-13b-reading-tools
- runFlow: ../subflows/healthy.yaml
- back
- waitForAnimationToEnd
- runFlow: ../subflows/healthy.yaml
- assertVisible:
