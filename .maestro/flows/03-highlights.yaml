appId: app.sard.reader
---
- runFlow:
    file: ../subflows/deeplink.yaml
    env:
      LINK: "sard://highlights"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 15-highlights
- runFlow: ../subflows/healthy.yaml
- scroll
- takeScreenshot: 15-highlights-b
- runFlow: ../subflows/healthy.yaml
