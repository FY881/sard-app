name: Sard publish APK to builds branch

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of a successful "Sard APK" run'
        required: true
  workflow_run:
    workflows: ['Sard APK']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sard-APK
          path: apk
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Push APK to builds branch
        run: |
          cd apk
          git init -q -b builds
          git config user.name "sard-ci"; git config user.email "sard-ci@users.noreply.github.com"
          git add *.apk
          git commit -qm "APK from run ${{ github.event.inputs.run_id || github.event.workflow_run.id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
