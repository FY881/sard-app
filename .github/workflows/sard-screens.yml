name: Sard screenshots

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of a successful "Sard APK" run'
        required: true
  workflow_run:
    workflows: ['Sard APK']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  screens:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Sard-APK
          path: apk
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run app on emulator and capture screens
        id: emu
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p shots
          bash .maestro/ci-emulator.sh > shots/emulator.log 2>&1
      - name: Push screenshots to builds branch
        if: always()
        run: |
          mkdir -p shots && echo "emulator step: ${{ steps.emu.outcome }}" > shots/status.txt
          mkdir -p out && cp -r shots out/ 2>/dev/null || true
          cd out
          git init -q -b screens
          git config user.name "sard-ci"; git config user.email "sard-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Screens from run ${{ github.event.inputs.run_id || github.event.workflow_run.id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens
